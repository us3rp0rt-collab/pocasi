<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter · Rhede · Raalte · Zlín · Brno</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-deep:  #0b1a2e;
    --accent:    #5eaee8;
    --warm:      #f79552;
    --cloud:     #c9dff5;
    --rain:      #7ab8e8;
    --text:      #e8f2fc;
    --text-dim:  #7fa8cc;
    --card-bg:   rgba(19,40,68,0.80);
    --border:    rgba(94,174,232,0.18);
    --radius:    18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--sky-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate; opacity: 0;
  }
  @keyframes twinkle { from { opacity: 0.05; } to { opacity: var(--op, 0.6); } }

  /* Aurora */
  .aurora {
    position: fixed; top: 0; left: 0; right: 0; height: 340px;
    z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 60% at 50% -10%,
      rgba(30,64,112,0.9) 0%, rgba(94,174,232,0.18) 55%, transparent 80%);
    animation: aurora-shift 12s ease-in-out infinite alternate;
  }
  @keyframes aurora-shift {
    0%   { transform: scaleX(1)   translateY(0); }
    50%  { transform: scaleX(1.1) translateY(8px); }
    100% { transform: scaleX(0.95) translateY(-6px); }
  }

  /* Layout */
  .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 48px 24px 80px; }

  /* ── Language Switcher ── */
  .lang-switcher {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
    animation: fade-up 0.6s ease both;
  }
  .lang-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    backdrop-filter: blur(12px);
    transition: all 0.2s ease;
    user-select: none;
  }
  .lang-btn:hover {
    border-color: rgba(94,174,232,0.45);
    color: var(--cloud);
    transform: translateY(-1px);
  }
  .lang-btn.active {
    background: rgba(94,174,232,0.18);
    border-color: rgba(94,174,232,0.55);
    color: var(--cloud);
    box-shadow: 0 0 16px rgba(94,174,232,0.15);
  }
  .lang-flag { font-size: 1.25rem; line-height: 1; }
  .lang-label { font-size: 0.65rem; }

  /* Header */
  header { text-align: center; margin-bottom: 56px; animation: fade-up 0.8s ease both; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 700;
    letter-spacing: 0.04em; color: var(--cloud);
    text-shadow: 0 0 40px rgba(94,174,232,0.5);
  }
  header .subtitle { margin-top: 10px; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); }
  header .timestamp { margin-top: 6px; font-size: 0.68rem; color: var(--text-dim); opacity: 0.7; }

  /* Loading */
  .loading {
    text-align: center; padding: 80px 0;
    font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim); animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  .loading-dots::after { content: ''; animation: dots 1.5s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} 100%{content:''} }

  /* Error */
  .error-msg {
    text-align: center; padding: 40px;
    color: #e87d7d; font-size: 0.8rem; letter-spacing: 0.1em;
    border: 1px solid rgba(232,125,125,0.3); border-radius: var(--radius);
    background: rgba(232,125,125,0.06); line-height: 2;
  }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; }

  /* Card */
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px 28px 28px;
    backdrop-filter: blur(18px); animation: fade-up 0.8s ease both;
    position: relative; overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(94,174,232,0.28); }
  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(94,174,232,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .card:nth-child(1){animation-delay:0.1s} .card:nth-child(2){animation-delay:0.25s}
  .card:nth-child(3){animation-delay:0.4s}  .card:nth-child(4){animation-delay:0.55s}

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
  .flag { font-size: 1.6rem; line-height: 1; margin-bottom: 4px; }
  .city { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 700; color: var(--cloud); line-height: 1.15; }
  .country { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; }
  .condition-icon { font-size: 3rem; line-height: 1; filter: drop-shadow(0 0 12px rgba(94,174,232,0.5)); }

  .current-temp { display: flex; align-items: baseline; gap: 4px; margin-bottom: 6px; }
  .temp-value { font-family: 'Playfair Display', serif; font-size: 4rem; font-weight: 700; line-height: 1; color: var(--accent); text-shadow: 0 0 30px rgba(94,174,232,0.4); }
  .temp-unit { font-size: 1.4rem; color: var(--text-dim); }
  .condition-text { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 28px; }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 0 -4px 24px; }

  .forecast-label { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .forecast-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(94,174,232,0.07); }
  .forecast-row:last-child { border-bottom: none; }
  .f-day { font-size: 0.7rem; color: var(--text-dim); width: 36px; }
  .f-icon { font-size: 1.1rem; }
  .f-bar-wrap { flex: 1; margin: 0 12px; position: relative; height: 4px; background: rgba(94,174,232,0.1); border-radius: 2px; }
  .f-bar { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--warm)); transition: width 1s ease; }
  .f-temp { font-size: 0.75rem; font-weight: 500; color: var(--cloud); width: 36px; text-align: right; }
  .f-rain { font-size: 0.62rem; color: var(--rain); width: 28px; text-align: right; }

  /* Compare */
  .compare-section { margin-top: 56px; animation: fade-up 0.8s 0.65s ease both; }
  .compare-label { text-align: center; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px; }
  .compare-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .compare-day { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; backdrop-filter: blur(12px); }
  .compare-day-name { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .compare-bars { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 56px; }
  .compare-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .compare-bar { width: 10px; border-radius: 3px 3px 0 0; background: var(--col); transition: height 1.2s ease; }
  .compare-bar-val { font-size: 0.5rem; color: var(--text-dim); }

  .legend { display: flex; justify-content: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.62rem; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .source { text-align: center; margin-top: 40px; font-size: 0.6rem; color: var(--text-dim); opacity: 0.5; letter-spacing: 0.1em; }
  .source a { color: var(--text-dim); text-decoration: none; }
  .source a:hover { opacity: 1; text-decoration: underline; }

  @keyframes fade-up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .compare-grid { grid-template-columns: repeat(3, 1fr); }
    .compare-day:nth-child(n+4) { display: none; }
    .lang-btn .lang-label { display: none; }
    .lang-btn { padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="aurora"></div>

<div class="page">

  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('de')" id="btn-de">
      <span class="lang-flag">🇩🇪</span>
      <span class="lang-label">Deutsch</span>
    </button>
    <button class="lang-btn" onclick="setLang('nl')" id="btn-nl">
      <span class="lang-flag">🇳🇱</span>
      <span class="lang-label">Nederlands</span>
    </button>
    <button class="lang-btn" onclick="setLang('cz')" id="btn-cz">
      <span class="lang-flag">🇨🇿</span>
      <span class="lang-label">Čeština</span>
    </button>
  </div>

  <header>
    <h1 id="title-text">Wetterübersicht</h1>
    <div class="subtitle">Rhede &nbsp;·&nbsp; Raalte &nbsp;·&nbsp; Zlín &nbsp;·&nbsp; Brno</div>
    <div class="timestamp" id="ts"></div>
  </header>

  <div id="main-content">
    <div class="loading" id="loading-msg">Wetterdaten werden geladen <span class="loading-dots"></span></div>
  </div>

  <div class="compare-section" id="compare-section" style="display:none">
    <div class="compare-label" id="compare-label-text">5-Tage Höchsttemperaturen im Vergleich</div>
    <div class="compare-grid" id="compare"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="source" id="source-text">
    Echtzeit-Daten: <a href="https://open-meteo.com" target="_blank">Open-Meteo.com</a> &nbsp;·&nbsp; <span id="source-refresh"></span>
  </div>
</div>

<script>
// ── Starfield ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 130; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.2 + 0.5;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;--op:${(Math.random()*0.5+0.15).toFixed(2)};animation-delay:${(Math.random()*5).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// ── Translations ──
const LANGS = {
  de: {
    title:        'Wetterübersicht',
    loading:      'Wetterdaten werden geladen',
    stand:        'Stand',
    uhr:          'Uhr',
    compareLabel: '5-Tage Höchsttemperaturen im Vergleich',
    forecastLabel:'5-Tage Vorhersage · 💧 Regenwahrscheinlichkeit',
    refresh:      'Aktualisiert bei jedem Seitenaufruf',
    errorTitle:   '⚠️ Wetterdaten konnten nicht geladen werden.',
    errorHint:    'Bitte Internetverbindung prüfen und Seite neu laden.',
    countries: { Deutschland:'Deutschland', Niederlande:'Niederlande', Tschechien:'Tschechien' },
    wmo: {
      0:'Klar', 1:'Teils bewölkt', 2:'Teils bewölkt', 3:'Bewölkt',
      45:'Neblig', 48:'Neblig', 51:'Nieselregen', 53:'Nieselregen', 55:'Nieselregen',
      61:'Regen', 63:'Regen', 65:'Starkregen', 71:'Schnee', 73:'Schnee', 75:'Schnee',
      80:'Regenschauer', 81:'Regenschauer', 82:'Regenschauer',
      85:'Schneeschauer', 86:'Schneeschauer', 95:'Gewitter', 96:'Gewitter', 99:'Gewitter',
    },
    days: ['So','Mo','Di','Mi','Do','Fr','Sa'],
  },
  nl: {
    title:        'Weersoverzicht',
    loading:      'Weergegevens worden geladen',
    stand:        'Stand',
    uhr:          'uur',
    compareLabel: '5-daagse maximumtemperaturen vergeleken',
    forecastLabel:'5-daagse voorspelling · 💧 Neerslagkans',
    refresh:      'Bijgewerkt bij elk paginabezoek',
    errorTitle:   '⚠️ Weergegevens konden niet worden geladen.',
    errorHint:    'Controleer de internetverbinding en laad de pagina opnieuw.',
    countries: { Deutschland:'Duitsland', Niederlande:'Nederland', Tschechien:'Tsjechië' },
    wmo: {
      0:'Helder', 1:'Gedeeltelijk bewolkt', 2:'Gedeeltelijk bewolkt', 3:'Bewolkt',
      45:'Mistig', 48:'Mistig', 51:'Motregen', 53:'Motregen', 55:'Motregen',
      61:'Regen', 63:'Regen', 65:'Zware regen', 71:'Sneeuw', 73:'Sneeuw', 75:'Sneeuw',
      80:'Regenbuien', 81:'Regenbuien', 82:'Regenbuien',
      85:'Sneeuwbuien', 86:'Sneeuwbuien', 95:'Onweer', 96:'Onweer', 99:'Onweer',
    },
    days: ['Zo','Ma','Di','Wo','Do','Vr','Za'],
  },
  cz: {
    title:        'Přehled počasí',
    loading:      'Načítání dat o počasí',
    stand:        'Stav',
    uhr:          'hod',
    compareLabel: 'Porovnání maximálních teplot na 5 dní',
    forecastLabel:'Předpověď na 5 dní · 💧 Pravděpodobnost srážek',
    refresh:      'Aktualizováno při každém načtení stránky',
    errorTitle:   '⚠️ Data o počasí se nepodařilo načíst.',
    errorHint:    'Zkontrolujte připojení k internetu a obnovte stránku.',
    countries: { Deutschland:'Německo', Niederlande:'Nizozemsko', Tschechien:'Česká republika' },
    wmo: {
      0:'Jasno', 1:'Částečně oblačno', 2:'Částečně oblačno', 3:'Oblačno',
      45:'Mlhavo', 48:'Mlhavo', 51:'Mrholení', 53:'Mrholení', 55:'Mrholení',
      61:'Déšť', 63:'Déšť', 65:'Silný déšť', 71:'Sníh', 73:'Sníh', 75:'Sníh',
      80:'Přeháňky', 81:'Přeháňky', 82:'Přeháňky',
      85:'Sněhové přeháňky', 86:'Sněhové přeháňky', 95:'Bouřka', 96:'Bouřka', 99:'Bouřka',
    },
    days: ['Ne','Po','Út','St','Čt','Pá','So'],
  }
};

let currentLang = 'de';
let cachedData  = null;

// ── WMO → text + icon ──
function wmoInfo(code, isDay, lang) {
  const t = LANGS[lang];
  // find best matching key (exact or nearest lower)
  const keys = Object.keys(t.wmo).map(Number).sort((a,b)=>a-b);
  let label = t.wmo[0];
  for (const k of keys) { if (code >= k) label = t.wmo[k]; }

  let icon;
  if (code === 0)       icon = isDay ? '☀️' : '🌙';
  else if (code <= 2)   icon = '⛅';
  else if (code === 3)  icon = '☁️';
  else if (code <= 49)  icon = '🌫️';
  else if (code <= 55)  icon = '🌦️';
  else if (code <= 67)  icon = '🌧️';
  else if (code <= 77)  icon = '❄️';
  else if (code <= 82)  icon = '🌦️';
  else if (code <= 86)  icon = '🌨️';
  else                  icon = '⛈️';

  return { text: label, icon };
}

const rainIcon = p => p >= 70 ? '🌧️' : p >= 40 ? '🌦️' : p >= 15 ? '⛅' : '☀️';

// ── Timestamp ──
function updateTimestamp(lang) {
  const t  = LANGS[lang];
  const lo = lang === 'cz' ? 'cs-CZ' : lang === 'nl' ? 'nl-NL' : 'de-DE';
  const ts = new Date().toLocaleString(lo, {
    weekday:'long', day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
  document.getElementById('ts').textContent = `${t.stand}: ${ts} ${t.uhr}`;
}

// ── Config ──
const LOCATIONS = [
  { city:'Rhede',  country:'Deutschland', flag:'🇩🇪', lat:51.8344, lon:6.6993  },
  { city:'Raalte', country:'Niederlande', flag:'🇳🇱', lat:52.3908, lon:6.2769  },
  { city:'Zlín',   country:'Tschechien',  flag:'🇨🇿', lat:49.2233, lon:17.6608 },
  { city:'Brno',   country:'Tschechien',  flag:'🇨🇿', lat:49.1951, lon:16.6068 },
];
const BAR_COLORS = ['#5eaee8','#4fc3a1','#f5c542','#e87d5e'];

// ── Fetch ──
async function fetchWeather(loc) {
  const url = `https://api.open-meteo.com/v1/forecast`
    + `?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&current=temperature_2m,weather_code,is_day`
    + `&daily=weather_code,temperature_2m_max,precipitation_probability_max`
    + `&timezone=auto&forecast_days=5`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${loc.city}`);
  const d = await res.json();
  return {
    ...loc,
    current: {
      temperature: d.current.temperature_2m,
      isDay:       d.current.is_day === 1,
      wmoCode:     d.current.weather_code,
    },
    daily: d.daily.time.map((date, i) => ({
      date,
      high:    d.daily.temperature_2m_max[i],
      precipitation_chance: d.daily.precipitation_probability_max[i] ?? 0,
      wmoCode: d.daily.weather_code[i],
    }))
  };
}

// ── Render with given language ──
function render(allData, lang) {
  const t        = LANGS[lang];
  const allHighs = allData.flatMap(d => d.daily.map(x => x.high));
  const maxHigh  = Math.max(...allHighs);

  // Update static UI texts
  document.getElementById('title-text').textContent      = t.title;
  document.getElementById('compare-label-text').textContent = t.compareLabel;
  document.getElementById('source-refresh').textContent  = t.refresh;
  document.documentElement.lang = lang === 'cz' ? 'cs' : lang;
  updateTimestamp(lang);

  // Cards
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.id = 'weather-grid';

  allData.forEach(loc => {
    const { text: condText, icon: condIcon } = wmoInfo(loc.current.wmoCode, loc.current.isDay, lang);
    const maxH = Math.max(...loc.daily.map(d => d.high));

    const rows = loc.daily.map(d => {
      const dn = t.days[new Date(d.date).getDay()];
      return `
        <div class="forecast-row">
          <span class="f-day">${dn}</span>
          <span class="f-icon">${rainIcon(d.precipitation_chance)}</span>
          <div class="f-bar-wrap"><div class="f-bar" style="width:${(d.high/maxH*100).toFixed(1)}%"></div></div>
          <span class="f-temp">${d.high.toFixed(1)}°</span>
          <span class="f-rain">${d.precipitation_chance}%</span>
        </div>`;
    }).join('');

    const countryName = t.countries[loc.country] || loc.country;

    grid.innerHTML += `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="flag">${loc.flag}</div>
            <div class="city">${loc.city}</div>
            <div class="country">${countryName}</div>
          </div>
          <div class="condition-icon">${condIcon}</div>
        </div>
        <div class="current-temp">
          <span class="temp-value">${loc.current.temperature.toFixed(1)}</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="condition-text">${condText}</div>
        <div class="divider"></div>
        <div class="forecast-label">${t.forecastLabel}</div>
        ${rows}
      </div>`;
  });

  const existing = document.getElementById('weather-grid');
  if (existing) existing.replaceWith(grid);
  else document.getElementById('main-content').replaceWith(grid);

  // Comparison
  const compareEl = document.getElementById('compare');
  const legendEl  = document.getElementById('legend');
  compareEl.innerHTML = '';
  legendEl.innerHTML  = '';

  const days = allData[0].daily;
  days.forEach((_, di) => {
    const bars = allData.map((loc, li) => {
      const h   = loc.daily[di].high;
      const pct = ((h / maxHigh) * 52).toFixed(1);
      return `<div class="compare-bar-wrap">
        <div class="compare-bar" style="height:${pct}px;--col:${BAR_COLORS[li]};"></div>
        <div class="compare-bar-val">${h.toFixed(0)}°</div>
      </div>`;
    }).join('');

    const d   = new Date(days[di].date);
    const dn  = t.days[d.getDay()];
    compareEl.innerHTML += `
      <div class="compare-day">
        <div class="compare-day-name">${dn} ${d.getDate()}.${d.getMonth()+1}.</div>
        <div class="compare-bars">${bars}</div>
      </div>`;
  });

  legendEl.innerHTML = allData.map((loc, li) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${BAR_COLORS[li]}"></div>
      <span>${loc.city}</span>
    </div>`).join('');

  document.getElementById('compare-section').style.display = '';
}

// ── Language switch ──
function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;

  // Update active button
  ['de','nl','cz'].forEach(l => {
    document.getElementById(`btn-${l}`).classList.toggle('active', l === lang);
  });

  // Re-render with cached data if available
  if (cachedData) render(cachedData, lang);
}

// ── Init ──
async function init() {
  const t = LANGS[currentLang];
  updateTimestamp(currentLang);

  try {
    cachedData = await Promise.all(LOCATIONS.map(fetchWeather));
    render(cachedData, currentLang);
  } catch (err) {
    const mc = document.getElementById('main-content');
    if (mc) {
      mc.innerHTML = `
        <div class="error-msg">
          ${LANGS[currentLang].errorTitle}<br>
          <small>${err.message}</small><br>
          <small>${LANGS[currentLang].errorHint}</small>
        </div>`;
    }
    console.error(err);
  }
}

init();
</script>
